[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schroedingerequation"
version = "0.2.0"
description = "Python wrapper for SchroedingerEquation.jl"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "juliacall>=0.9.15",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["schroedingerequation"]
include = ["schroedingerequation/juliapkg.json"]
